<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar Cachorro Aleatorio</title>

<style>
    body {
        background-color: #f0bbf8;
        text-align: center;
        padding: 50px;
    }

    h1 {
        color: #9314ad;
        font-size: 35px;
    }

    button {
        background-color: #d540ec;
        color: rgb(184, 236, 225);
        padding: 20px 20px;
        border-radius: 100px;
        font-size: 20px;
        margin-bottom: 20px;
    }

    img {
        border-radius: 20px;
        border: 20px solid white;
    }
</style>

</head>
<body>
<h1>Buscar Cachorro</h1>

<button id="buscar">Mostrar cachorro</button>

<div>
<img id="cachorro" alt="Foto aleatoria" width="600" height="400">
</div>

<script src="script.js"></script>
</body>
</html>
